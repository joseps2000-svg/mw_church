<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신약 성경통독 — 망원교회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --cream: #fdf6e8;
    --dark: #1a1209;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--dark);
    background-image:
      radial-gradient(ellipse at 20% 10%, #2a1a05 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, #1f1505 0%, transparent 50%);
    min-height: 100vh;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--cream);
    padding: 40px 20px 80px;
  }

  .container { max-width: 720px; margin: 0 auto; }

  .header { text-align:center; margin-bottom:48px; animation: fadeDown 0.8s ease both; }
  .church-name { font-size:12px; letter-spacing:4px; color:var(--gold); margin-bottom:12px; opacity:0.8; }
  .title { font-family:'Noto Serif KR',serif; font-size:clamp(32px,7vw,52px); font-weight:700; color:var(--cream); line-height:1.2; }
  .title span { color:var(--gold); }
  .divider-ornament { display:flex; align-items:center; justify-content:center; gap:12px; margin:20px 0; }
  .divider-ornament::before { content:''; height:1px; width:80px; background:linear-gradient(to right,transparent,var(--gold)); }
  .divider-ornament::after  { content:''; height:1px; width:80px; background:linear-gradient(to left, transparent,var(--gold)); }
  .diamond { width:6px; height:6px; background:var(--gold); transform:rotate(45deg); }
  .subtitle { font-size:13px; color:#a89060; letter-spacing:2px; }

  .user-info { display:flex; gap:16px; margin-bottom:12px; animation: fadeUp 0.8s ease 0.2s both; }
  .info-box { flex:1; background:rgba(201,168,76,0.08); border:1px solid rgba(201,168,76,0.25); border-radius:10px; padding:14px 18px; display:flex; align-items:center; gap:10px; }
  .info-label { font-size:11px; color:var(--gold); letter-spacing:2px; white-space:nowrap; }
  .info-input { flex:1; background:none; border:none; border-bottom:1px solid rgba(201,168,76,0.3); color:var(--cream); font-size:14px; font-family:'Noto Sans KR',sans-serif; padding:2px 4px; outline:none; transition:border-color 0.2s; }
  .info-input:focus { border-bottom-color:var(--gold); }
  .info-input::placeholder { color:rgba(253,246,232,0.2); }

  .save-row { display:flex; align-items:center; gap:12px; margin-bottom:32px; animation: fadeUp 0.8s ease 0.25s both; }
  .save-btn { flex:1; background:rgba(201,168,76,0.12); border:1px solid rgba(201,168,76,0.3); border-radius:10px; color:var(--gold); font-size:12px; font-family:'Noto Sans KR',sans-serif; letter-spacing:2px; padding:11px; cursor:pointer; transition:all 0.2s; }
  .save-btn:hover { background:rgba(201,168,76,0.22); border-color:var(--gold); }
  .save-msg { font-size:12px; color:var(--gold); letter-spacing:1px; opacity:0; transition:opacity 0.3s; white-space:nowrap; }
  .save-msg.show { opacity:1; }

  .progress-section { margin-bottom:40px; animation: fadeUp 0.8s ease 0.3s both; }
  .progress-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .progress-label { font-size:11px; letter-spacing:2px; color:var(--gold); }
  .progress-count { font-size:13px; color:#a89060; }
  .progress-bar { height:4px; background:rgba(201,168,76,0.15); border-radius:2px; overflow:hidden; }
  .progress-fill { height:100%; background:linear-gradient(to right,var(--gold),var(--gold-light)); border-radius:2px; width:0%; transition:width 0.5s ease; }

  /* 날짜 카드 */
  .date-card { margin-bottom:10px; border-radius:14px; overflow:hidden; border:1px solid rgba(255,255,255,0.05); animation: fadeUp 0.7s ease both; }

  .date-header { display:flex; align-items:center; gap:14px; padding:14px 18px; background:rgba(201,168,76,0.07); border-bottom:1px solid rgba(201,168,76,0.1); cursor:pointer; user-select:none; transition:background 0.2s; }
  .date-header:hover { background:rgba(201,168,76,0.13); }
  .date-header.all-done { background:rgba(201,168,76,0.04); opacity:0.5; }
  .date-header.sunday { background:rgba(180,100,80,0.08); border-bottom-color:rgba(180,100,80,0.15); }
  .date-header.sunday:hover { background:rgba(180,100,80,0.14); }

  .date-badge { display:flex; flex-direction:column; align-items:center; justify-content:center; width:50px; height:50px; background:rgba(201,168,76,0.13); border:1px solid rgba(201,168,76,0.28); border-radius:10px; flex-shrink:0; }
  .date-badge.sun-badge { background:rgba(180,100,80,0.15); border-color:rgba(180,100,80,0.3); }
  .m-txt { font-size:9px; color:var(--gold); letter-spacing:1px; line-height:1; }
  .d-txt { font-family:'Noto Serif KR',serif; font-size:22px; font-weight:700; color:var(--gold-light); line-height:1.1; }
  .sun-badge .m-txt { color:#e08060; }
  .sun-badge .d-txt { color:#f0a080; }
  .date-header.all-done .date-badge { background:rgba(201,168,76,0.06); border-color:rgba(201,168,76,0.12); }

  .date-info { flex:1; min-width:0; }
  .date-dow { font-size:10px; color:#6a5030; letter-spacing:2px; margin-bottom:3px; }
  .date-dow.sun { color:#c07050; }
  .date-books { font-family:'Noto Serif KR',serif; font-size:14px; font-weight:600; color:var(--cream); line-height:1.4; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .date-header.all-done .date-books { color:var(--gold); }

  .date-right { display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .mini-prog { font-size:11px; color:#5a4020; }
  .done-mark { display:none; font-size:18px; color:var(--gold); }
  .date-header.all-done .done-mark { display:block; }
  .date-header.all-done .mini-prog { display:none; }
  .chevron { font-size:10px; color:#5a4020; transition:transform 0.25s ease; margin-left:2px; }
  .date-card.open .chevron { transform:rotate(180deg); }

  .items-wrap { max-height:0; overflow:hidden; transition:max-height 0.3s ease; }
  .date-card.open .items-wrap { max-height:800px; }

  .reading-item { display:grid; grid-template-columns:32px 1fr auto 44px; align-items:center; gap:10px; padding:13px 18px; background:rgba(255,255,255,0.015); border-bottom:1px solid rgba(255,255,255,0.04); cursor:pointer; transition:background 0.2s; user-select:none; }
  .reading-item:last-child { border-bottom:none; }
  .reading-item:hover { background:rgba(201,168,76,0.07); }
  .reading-item.done { background:rgba(201,168,76,0.04); opacity:0.5; }

  .item-num { font-size:11px; color:#4a3010; font-weight:500; text-align:center; }
  .item-book { font-family:'Noto Serif KR',serif; font-size:14px; font-weight:600; color:var(--cream); }
  .reading-item.done .item-book { color:var(--gold); }
  .item-ch { font-size:12px; color:#6a5030; white-space:nowrap; }

  .check-box { width:26px; height:26px; border:1.5px solid rgba(201,168,76,0.25); border-radius:6px; display:flex; align-items:center; justify-content:center; transition:all 0.2s ease; flex-shrink:0; margin-left:auto; }
  .reading-item.done .check-box { background:var(--gold); border-color:var(--gold); }
  .check-icon { opacity:0; transform:scale(0); transition:all 0.2s ease; color:var(--dark); font-size:13px; font-weight:bold; }
  .reading-item.done .check-icon { opacity:1; transform:scale(1); }

  .month-div { display:flex; align-items:center; gap:12px; margin:28px 0 14px; animation: fadeUp 0.7s ease both; }
  .month-div-line { flex:1; height:1px; background:rgba(201,168,76,0.18); }
  .month-div-txt { font-size:10px; letter-spacing:4px; color:var(--gold); opacity:0.6; white-space:nowrap; }

  .footer { text-align:center; margin-top:60px; padding-top:30px; border-top:1px solid rgba(201,168,76,0.15); }
  .footer-text { font-size:11px; letter-spacing:3px; color:#4a3818; }

  @keyframes fadeDown { from{opacity:0;transform:translateY(-20px)} to{opacity:1;transform:translateY(0)} }
  @keyframes fadeUp   { from{opacity:0;transform:translateY(16px)}  to{opacity:1;transform:translateY(0)} }

  @media(max-width:480px){
    .reading-item { grid-template-columns:26px 1fr auto 36px; gap:8px; padding:12px 14px; }
    .date-books { font-size:13px; }
  }
</style>
</head>
<body>
<div class="container">

  <header class="header">
    <p class="church-name">망원교회 · Mangwon Church</p>
    <h1 class="title">신약 <span>성경통독</span></h1>
    <div class="divider-ornament"><div class="diamond"></div></div>
    <p class="subtitle">NEW TESTAMENT READING PLAN · 2026</p>
  </header>

  <div class="user-info">
    <div class="info-box">
      <span class="info-label">구역</span>
      <input class="info-input" id="inputDistrict" type="text" placeholder="입력하세요">
    </div>
    <div class="info-box">
      <span class="info-label">이름</span>
      <input class="info-input" id="inputName" type="text" placeholder="입력하세요">
    </div>
  </div>
  <div class="save-row">
    <button class="save-btn" onclick="saveProfile()">✦ 이름 저장하기</button>
    <span class="save-msg" id="saveMsg">✓ 저장되었습니다</span>
  </div>

  <div class="progress-section">
    <div class="progress-header">
      <span class="progress-label">PROGRESS</span>
      <span class="progress-count" id="progressText">0 / 40 완료</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div id="planContainer"></div>

  <footer class="footer">
    <p class="footer-text">대한예수교장로회 · 망원교회</p>
  </footer>
</div>

<script>
// 2026년 실제 요일 기준
const dateGroups = [
  // ── 2월 ──
  { date:"2월 18일", dow:"수", isSun:false, month:"feb", items:[{n:1,  book:"마태복음",   ch:"1-6장"}]},
  { date:"2월 19일", dow:"목", isSun:false, month:"feb", items:[{n:2,  book:"마태복음",   ch:"7-12장"}]},

  { date:"2월 23일", dow:"월", isSun:false, month:"feb", items:[{n:5,  book:"마태복음",   ch:"24-28장"}]},
  { date:"2월 24일", dow:"화", isSun:false, month:"feb", items:[{n:6,  book:"마가복음",   ch:"1-6장"}]},
  { date:"2월 25일", dow:"수", isSun:false, month:"feb", items:[{n:7,  book:"마가복음",   ch:"7-11장"}]},
  { date:"2월 26일", dow:"목", isSun:false, month:"feb", items:[{n:8,  book:"마가복음",   ch:"12-16장"}]},
  { date:"2월 27일", dow:"금", isSun:false, month:"feb", items:[{n:9,  book:"누가복음",   ch:"1-6장"}]},
  { date:"2월 28일", dow:"토", isSun:false, month:"feb", items:[{n:10, book:"누가복음",   ch:"7-12장"}]},
  // ── 3월 ──
  { date:"3월 2일",  dow:"월", isSun:false, month:"mar", items:[{n:11, book:"누가복음",   ch:"13-18장"}]},
  { date:"3월 3일",  dow:"화", isSun:false, month:"mar", items:[{n:12, book:"누가복음",   ch:"19-24장"}]},
  { date:"3월 4일",  dow:"수", isSun:false, month:"mar", items:[{n:13, book:"요한복음",   ch:"1-6장"}]},
  { date:"3월 5일",  dow:"목", isSun:false, month:"mar", items:[{n:14, book:"요한복음",   ch:"7-11장"}]},
  { date:"3월 6일",  dow:"금", isSun:false, month:"mar", items:[{n:15, book:"요한복음",   ch:"12-16장"}]},
  { date:"3월 7일",  dow:"토", isSun:false, month:"mar", items:[{n:16, book:"요한복음",   ch:"17-21장"}]},
  { date:"3월 9일",  dow:"월", isSun:false, month:"mar", items:[{n:17, book:"사도행전",   ch:"1-6장"}]},
  { date:"3월 10일", dow:"화", isSun:false, month:"mar", items:[{n:18, book:"사도행전",   ch:"7-12장"}]},
  { date:"3월 11일", dow:"수", isSun:false, month:"mar", items:[{n:19, book:"사도행전",   ch:"13-18장"}]},
  { date:"3월 12일", dow:"목", isSun:false, month:"mar", items:[{n:20, book:"사도행전",   ch:"19-23장"}]},
  { date:"3월 13일", dow:"금", isSun:false, month:"mar", items:[{n:21, book:"사도행전",   ch:"24-28장"}]},
  { date:"3월 14일", dow:"토", isSun:false, month:"mar", items:[{n:22, book:"로마서",     ch:"1-5장"}]},
  { date:"3월 16일", dow:"월", isSun:false, month:"mar", items:[{n:23, book:"로마서",     ch:"6-10장"}]},
  { date:"3월 17일", dow:"화", isSun:false, month:"mar", items:[{n:24, book:"로마서",     ch:"11-16장"}]},
  { date:"3월 18일", dow:"수", isSun:false, month:"mar", items:[{n:25, book:"고린도전서", ch:"1-8장"}]},
  { date:"3월 19일", dow:"목", isSun:false, month:"mar", items:[{n:26, book:"고린도전서", ch:"9-16장"}]},
  { date:"3월 20일", dow:"금", isSun:false, month:"mar", items:[{n:27, book:"고린도후서", ch:"1-7장"}]},
  { date:"3월 21일", dow:"토", isSun:false, month:"mar", items:[{n:28, book:"고린도후서", ch:"8-13장"}]},
  { date:"3월 23일", dow:"월", isSun:false, month:"mar", items:[{n:29, book:"갈라디아서", ch:"1-6장"}]},
  { date:"3월 24일", dow:"화", isSun:false, month:"mar", items:[{n:30, book:"에베소서",   ch:"1-6장"}]},
  { date:"3월 25일", dow:"수", isSun:false, month:"mar", items:[
      {n:31, book:"빌립보서", ch:"1-4장"},
      {n:32, book:"골로새서", ch:"1-4장"}
  ]},
  { date:"3월 26일", dow:"목", isSun:false, month:"mar", items:[
      {n:33, book:"데살로니가전서", ch:"1-5장"},
      {n:34, book:"데살로니가후서", ch:"1-3장"}
  ]},
  { date:"3월 27일", dow:"금", isSun:false, month:"mar", items:[
      {n:35, book:"디모데전서", ch:"1-6장"},
      {n:36, book:"디모데후서", ch:"1-4장"},
      {n:37, book:"디도서",     ch:"1-3장"},
      {n:38, book:"빌레몬서",   ch:"1장"}
  ]},
  { date:"3월 28일", dow:"토", isSun:false, month:"mar", items:[{n:39, book:"히브리서",   ch:"1-7장"}]},
  { date:"3월 30일", dow:"월", isSun:false, month:"mar", items:[{n:40, book:"히브리서",   ch:"8-13장"}]},
  { date:"3월 31일", dow:"화", isSun:false, month:"mar", items:[
      {n:41, book:"야고보서",   ch:"1-5장"},
      {n:42, book:"베드로전서", ch:"1-5장"},
      {n:43, book:"베드로후서", ch:"1-3장"}
  ]},
  // ── 4월 ──
  { date:"4월 1일",  dow:"수", isSun:false, month:"apr", items:[
      {n:44, book:"요한일서", ch:"1-5장"},
      {n:45, book:"요한이서", ch:"1장"},
      {n:46, book:"요한삼서", ch:"1장"},
      {n:47, book:"유다서",   ch:"1장"}
  ]},
  { date:"4월 2일",  dow:"목", isSun:false, month:"apr", items:[{n:48, book:"요한계시록", ch:"1-8장"}]},
  { date:"4월 3일",  dow:"금", isSun:false, month:"apr", items:[{n:49, book:"요한계시록", ch:"9-15장"}]},
  { date:"4월 4일",  dow:"토", isSun:false, month:"apr", items:[{n:50, book:"요한계시록", ch:"16-22장"}]},
];

const monthLabels = { feb:"FEBRUARY · 2월", mar:"MARCH · 3월", apr:"APRIL · 4월" };
const totalItems = dateGroups.reduce((s,g) => s + g.items.length, 0);

function getUid() {
  let uid = localStorage.getItem('nt_uid');
  if (!uid) { uid = 'u_' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('nt_uid', uid); }
  return uid;
}
const STORE_KEY = 'nt_' + getUid();
let state = { district:'', name:'', checked:[] };
function load() { try { const r = localStorage.getItem(STORE_KEY); if(r) state = Object.assign(state, JSON.parse(r)); } catch(e){} }
function save() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

function saveProfile() {
  state.district = document.getElementById('inputDistrict').value.trim();
  state.name     = document.getElementById('inputName').value.trim();
  save();
  const msg = document.getElementById('saveMsg');
  msg.classList.add('show');
  setTimeout(() => msg.classList.remove('show'), 2000);
}

function updateProgress() {
  const done = state.checked.length;
  document.getElementById('progressText').textContent = `${done} / ${totalItems} 완료`;
  document.getElementById('progressFill').style.width = `${(done / totalItems) * 100}%`;
}

function render() {
  document.getElementById('inputDistrict').value = state.district;
  document.getElementById('inputName').value     = state.name;

  const container = document.getElementById('planContainer');
  container.innerHTML = '';
  let lastMonth = null;
  let delay = 0;

  dateGroups.forEach((group) => {
    if (group.month !== lastMonth) {
      if (lastMonth !== null) {
        const md = document.createElement('div');
        md.className = 'month-div';
        md.style.animationDelay = `${delay}s`;
        md.innerHTML = `<div class="month-div-line"></div><span class="month-div-txt">${monthLabels[group.month]}</span><div class="month-div-line"></div>`;
        container.appendChild(md);
      }
      lastMonth = group.month;
    }

    const doneCount = group.items.filter(i => state.checked.includes(i.n)).length;
    const allDone   = doneCount === group.items.length;
    const isSun     = group.dow === '일';

    const card = document.createElement('div');
    card.className = 'date-card' + (allDone ? '' : ' open');
    card.style.animationDelay = `${delay}s`;

    const mm = group.date.split(' ')[0];
    const dd = group.date.split(' ')[1].replace('일','');
    const bookNames = group.items.map(i => i.book).join(' · ');

    card.innerHTML = `
      <div class="date-header${allDone ? ' all-done' : ''}${isSun ? ' sunday' : ''}">
        <div class="date-badge${isSun ? ' sun-badge' : ''}">
          <span class="m-txt">${mm}</span>
          <span class="d-txt">${dd}</span>
        </div>
        <div class="date-info">
          <p class="date-dow${isSun ? ' sun' : ''}">${group.dow}요일</p>
          <p class="date-books">${bookNames}</p>
        </div>
        <div class="date-right">
          <span class="mini-prog">${doneCount}/${group.items.length}</span>
          <span class="done-mark">✓</span>
          <span class="chevron">▼</span>
        </div>
      </div>
      <div class="items-wrap"></div>
    `;

    const wrap = card.querySelector('.items-wrap');
    group.items.forEach(item => {
      const isDone = state.checked.includes(item.n);
      const row = document.createElement('div');
      row.className = 'reading-item' + (isDone ? ' done' : '');
      row.innerHTML = `
        <span class="item-num">${item.n}</span>
        <span class="item-book">${item.book}</span>
        <span class="item-ch">${item.ch}</span>
        <div class="check-box"><span class="check-icon">✓</span></div>
      `;
      row.addEventListener('click', () => {
        const idx = state.checked.indexOf(item.n);
        if (idx > -1) { state.checked.splice(idx,1); row.classList.remove('done'); }
        else          { state.checked.push(item.n);  row.classList.add('done'); }
        save();
        updateProgress();
        const nd = group.items.filter(i => state.checked.includes(i.n)).length;
        const na = nd === group.items.length;
        card.querySelector('.mini-prog').textContent = `${nd}/${group.items.length}`;
        card.querySelector('.date-header').className = `date-header${na?' all-done':''}${isSun?' sunday':''}`;
        if (na) card.classList.remove('open');
      });
      wrap.appendChild(row);
    });

    card.querySelector('.date-header').addEventListener('click', () => card.classList.toggle('open'));
    container.appendChild(card);
    delay += 0.03;
  });

  updateProgress();
}

load();
render();
</script>
</body>
</html>
