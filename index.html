<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신약 성경통독 — 망원교회</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --cream: #fdf6e8;
    --dark: #1a1209;
    --brown: #3d2b0e;
    --brown-light: #6b4c22;
    --text: #2c1f08;
    --divider: #d4b87a44;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--dark);
    background-image:
      radial-gradient(ellipse at 20% 10%, #2a1a05 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, #1f1505 0%, transparent 50%);
    min-height: 100vh;
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--cream);
    padding: 40px 20px 80px;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeDown 0.8s ease both;
  }

  .church-name {
    font-size: 12px;
    letter-spacing: 4px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 12px;
    opacity: 0.8;
  }

  .title {
    font-family: 'Noto Serif KR', serif;
    font-size: clamp(32px, 7vw, 52px);
    font-weight: 700;
    color: var(--cream);
    line-height: 1.2;
    letter-spacing: -0.5px;
  }

  .title span {
    color: var(--gold);
  }

  .divider-ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 20px 0;
  }

  .divider-ornament::before,
  .divider-ornament::after {
    content: '';
    height: 1px;
    width: 80px;
    background: linear-gradient(to right, transparent, var(--gold));
  }

  .divider-ornament::after {
    background: linear-gradient(to left, transparent, var(--gold));
  }

  .diamond {
    width: 6px;
    height: 6px;
    background: var(--gold);
    transform: rotate(45deg);
  }

  .subtitle {
    font-size: 13px;
    color: #a89060;
    letter-spacing: 2px;
  }

  /* User Info */
  .user-info {
    display: flex;
    gap: 16px;
    margin-bottom: 40px;
    animation: fadeUp 0.8s ease 0.2s both;
  }

  .info-box {
    flex: 1;
    background: rgba(201, 168, 76, 0.08);
    border: 1px solid rgba(201, 168, 76, 0.25);
    border-radius: 10px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .info-label {
    font-size: 11px;
    color: var(--gold);
    letter-spacing: 2px;
    white-space: nowrap;
  }

  .info-input {
    flex: 1;
    background: none;
    border: none;
    border-bottom: 1px solid rgba(201, 168, 76, 0.3);
    color: var(--cream);
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    padding: 2px 4px;
    outline: none;
    transition: border-color 0.2s;
  }

  .info-input:focus {
    border-bottom-color: var(--gold);
  }

  .info-input::placeholder { color: rgba(253,246,232,0.2); }

  /* Progress */
  .progress-section {
    margin-bottom: 40px;
    animation: fadeUp 0.8s ease 0.3s both;
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .progress-label {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--gold);
  }

  .progress-count {
    font-size: 13px;
    color: #a89060;
  }

  .progress-bar {
    height: 4px;
    background: rgba(201, 168, 76, 0.15);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(to right, var(--gold), var(--gold-light));
    border-radius: 2px;
    width: 0%;
    transition: width 0.5s ease;
  }

  /* Month sections */
  .month-section {
    margin-bottom: 32px;
    animation: fadeUp 0.8s ease both;
  }

  .month-label {
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--gold);
    opacity: 0.7;
    margin-bottom: 12px;
    padding-left: 4px;
  }

  /* Reading items */
  .reading-item {
    display: grid;
    grid-template-columns: 28px 1fr auto auto 44px;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    border-radius: 10px;
    margin-bottom: 6px;
    background: rgba(255,255,255,0.025);
    border: 1px solid rgba(255,255,255,0.05);
    cursor: pointer;
    transition: all 0.25s ease;
    user-select: none;
  }

  .reading-item:hover {
    background: rgba(201, 168, 76, 0.07);
    border-color: rgba(201, 168, 76, 0.2);
    transform: translateX(3px);
  }

  .reading-item.done {
    background: rgba(201, 168, 76, 0.06);
    border-color: rgba(201, 168, 76, 0.18);
    opacity: 0.6;
  }

  .item-num {
    font-size: 11px;
    color: #5a4020;
    font-weight: 500;
    text-align: center;
  }

  .item-book {
    font-family: 'Noto Serif KR', serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--cream);
    transition: color 0.2s;
  }

  .reading-item.done .item-book {
    color: var(--gold);
  }

  .item-chapters {
    font-size: 12px;
    color: #7a6040;
    white-space: nowrap;
  }

  .item-date {
    font-size: 11px;
    color: #6a5030;
    white-space: nowrap;
    text-align: right;
  }

  .check-box {
    width: 26px;
    height: 26px;
    border: 1.5px solid rgba(201, 168, 76, 0.3);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }

  .reading-item.done .check-box {
    background: var(--gold);
    border-color: var(--gold);
  }

  .check-icon {
    opacity: 0;
    transform: scale(0);
    transition: all 0.2s ease;
    color: var(--dark);
    font-size: 14px;
    font-weight: bold;
  }

  .reading-item.done .check-icon {
    opacity: 1;
    transform: scale(1);
  }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 60px;
    padding-top: 30px;
    border-top: 1px solid rgba(201,168,76,0.15);
  }

  .footer-text {
    font-size: 11px;
    letter-spacing: 3px;
    color: #4a3818;
  }

  /* Animations */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Responsive */
  @media (max-width: 480px) {
    .reading-item {
      grid-template-columns: 22px 1fr auto 36px;
      gap: 8px;
      padding: 12px 12px;
    }
    .item-date { display: none; }
    .item-book { font-size: 14px; }
  }
</style>
</head>
<body>
<div class="container">

  <header class="header">
    <p class="church-name">망원교회 · Mangwon Church</p>
    <h1 class="title">신약 <span>성경통독</span></h1>
    <div class="divider-ornament"><div class="diamond"></div></div>
    <p class="subtitle">NEW TESTAMENT READING PLAN</p>
  </header>

  <div class="user-info">
    <div class="info-box">
      <span class="info-label">구역</span>
      <input class="info-input" type="text" placeholder="입력하세요">
    </div>
    <div class="info-box">
      <span class="info-label">이름</span>
      <input class="info-input" type="text" placeholder="입력하세요">
    </div>
  </div>

  <div class="progress-section">
    <div class="progress-header">
      <span class="progress-label">PROGRESS</span>
      <span class="progress-count" id="progressText">0 / 40 완료</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
  </div>

  <div id="planContainer"></div>

  <footer class="footer">
    <p class="footer-text">대한예수교장로회 · 망원교회</p>
  </footer>

</div>

<script>
const plan = [
  // 2월
  {n:1,  book:"마태복음",     ch:"1-6장",   date:"2월 18일"},
  {n:2,  book:"마태복음",     ch:"7-12장",  date:"2월 19일"},
  {n:3,  book:"마태복음",     ch:"13-18장", date:"2월 20일"},
  {n:4,  book:"마태복음",     ch:"19-23장", date:"2월 21일"},
  {n:5,  book:"마태복음",     ch:"24-28장", date:"2월 23일"},
  {n:6,  book:"마가복음",     ch:"1-6장",   date:"2월 24일"},
  {n:7,  book:"마가복음",     ch:"7-11장",  date:"2월 25일"},
  {n:8,  book:"마가복음",     ch:"12-16장", date:"2월 26일"},
  {n:9,  book:"누가복음",     ch:"1-6장",   date:"2월 27일"},
  {n:10, book:"누가복음",     ch:"7-12장",  date:"2월 28일"},
  // 3월
  {n:11, book:"누가복음",     ch:"13-18장", date:"3월 2일"},
  {n:12, book:"누가복음",     ch:"19-24장", date:"3월 3일"},
  {n:13, book:"요한복음",     ch:"1-6장",   date:"3월 4일"},
  {n:14, book:"요한복음",     ch:"7-11장",  date:"3월 5일"},
  {n:15, book:"요한복음",     ch:"12-16장", date:"3월 6일"},
  {n:16, book:"요한복음",     ch:"17-21장", date:"3월 7일"},
  {n:17, book:"사도행전",     ch:"1-6장",   date:"3월 9일"},
  {n:18, book:"사도행전",     ch:"7-12장",  date:"3월 10일"},
  {n:19, book:"사도행전",     ch:"13-18장", date:"3월 11일"},
  {n:20, book:"사도행전",     ch:"19-23장", date:"3월 12일"},
  {n:21, book:"사도행전",     ch:"24-28장", date:"3월 13일"},
  {n:22, book:"로마서",       ch:"1-5장",   date:"3월 14일"},
  {n:23, book:"로마서",       ch:"6-10장",  date:"3월 16일"},
  {n:24, book:"로마서",       ch:"11-16장", date:"3월 17일"},
  {n:25, book:"고린도전서",   ch:"1-8장",   date:"3월 18일"},
  {n:26, book:"고린도전서",   ch:"9-16장",  date:"3월 19일"},
  {n:27, book:"고린도후서",   ch:"1-7장",   date:"3월 20일"},
  {n:28, book:"고린도후서",   ch:"8-13장",  date:"3월 21일"},
  {n:29, book:"갈라디아서",   ch:"1-6장",   date:"3월 23일"},
  {n:30, book:"에베소서",     ch:"1-6장",   date:"3월 24일"},
  {n:31, book:"빌립보서 / 골로새서", ch:"1-4장 / 1-4장", date:"3월 25일"},
  {n:32, book:"데살로니가전후서", ch:"전서 1-5장 / 후서 1-3장", date:"3월 26일"},
  {n:33, book:"디모데전후서 / 디도서 / 빌레몬서", ch:"전서·후서·디도·빌레몬", date:"3월 27일"},
  {n:34, book:"히브리서",     ch:"1-7장",   date:"3월 28일"},
  {n:35, book:"히브리서",     ch:"8-13장",  date:"3월 30일"},
  {n:36, book:"야고보서 / 베드로전후서", ch:"약·벧전·벧후", date:"3월 31일"},
  // 4월
  {n:37, book:"요한일이삼서 / 유다서", ch:"요일·요이·요삼·유다", date:"4월 1일"},
  {n:38, book:"요한계시록",   ch:"1-8장",   date:"4월 2일"},
  {n:39, book:"요한계시록",   ch:"9-15장",  date:"4월 3일"},
  {n:40, book:"요한계시록",   ch:"16-22장", date:"4월 4일"},
];

const months = [
  { label: "FEBRUARY · 2월", items: plan.slice(0, 10) },
  { label: "MARCH · 3월",    items: plan.slice(10, 36) },
  { label: "APRIL · 4월",    items: plan.slice(36, 40) },
];

const checked = new Set(JSON.parse(localStorage.getItem('ntChecked') || '[]'));

function save() {
  localStorage.setItem('ntChecked', JSON.stringify([...checked]));
}

function updateProgress() {
  const total = plan.length;
  const done = checked.size;
  document.getElementById('progressText').textContent = `${done} / ${total} 완료`;
  document.getElementById('progressFill').style.width = `${(done/total)*100}%`;
}

function render() {
  const container = document.getElementById('planContainer');
  container.innerHTML = '';

  months.forEach((month, mi) => {
    const section = document.createElement('div');
    section.className = 'month-section';
    section.style.animationDelay = `${0.3 + mi * 0.1}s`;

    const label = document.createElement('p');
    label.className = 'month-label';
    label.textContent = month.label;
    section.appendChild(label);

    month.items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'reading-item' + (checked.has(item.n) ? ' done' : '');

      row.innerHTML = `
        <span class="item-num">${item.n}</span>
        <span class="item-book">${item.book}</span>
        <span class="item-chapters">${item.ch}</span>
        <span class="item-date">${item.date}</span>
        <div class="check-box"><span class="check-icon">✓</span></div>
      `;

      row.addEventListener('click', () => {
        if (checked.has(item.n)) {
          checked.delete(item.n);
          row.classList.remove('done');
        } else {
          checked.add(item.n);
          row.classList.add('done');
        }
        save();
        updateProgress();
      });

      section.appendChild(row);
    });

    container.appendChild(section);
  });

  updateProgress();
}

render();
</script>
</body>
</html>
